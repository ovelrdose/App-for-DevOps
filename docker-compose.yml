version: '3.8'

services:
  web:
    build: .
    ports:
      - "5001:5001"
    environment:
      - DB_PATH=/app/data/cats.db
      - UPLOAD_FOLDER=/app/static/uploads
      - SECRET_KEY=your-production-secret-key-change-this
      - DEBUG=false
      - HOST=0.0.0.0
    volumes:
      - ./static/uploads:/app/static/uploads
      - ./data:/app/data
    restart: unless-stopped
